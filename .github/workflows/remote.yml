name: remote

# What the repository points at but does not hold (tools/check_remote.py): every release asset
# against its SHA256SUMS file, every linked release, and the four source mosaics still served at
# their addresses at the drive's exact sizes. Manual only: Actions -> remote -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check_remote.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
