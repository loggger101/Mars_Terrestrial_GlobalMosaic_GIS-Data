name: check

# Broken page links, Python syntax errors, oversized files, a stale CITATION.cff and page counts
# that no longer match the tree (tools/check_repo.py). The scripts themselves need arcpy and the project drive, so CI
# checks that they parse, not that they run.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check_repo.py
