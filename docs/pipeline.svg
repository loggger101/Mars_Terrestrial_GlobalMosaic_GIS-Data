<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" data-paper-height="446" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <title>Mars Global Mosaic: from four source mosaics to seven-class and four-class landform maps by support vector machine and U-Net, and digitising candidates</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .src{fill:#fff1e0;stroke:#b5651d}
      .mid{fill:#eaf2fb;stroke:#2f6db5}
      .out{fill:#e6f4ea;stroke:#2e7d4f}
      .hand{fill:#f3eafa;stroke:#7b4fa0}
      .open{fill:#ffffff;stroke:#7b4fa0;stroke-dasharray:5 4}
      rect.b{stroke-width:1.5}
      text{fill:#1f2328}
      .t{font-weight:bold}
      .s{fill:#4d555e;font-size:15px}
      .n{font-size:15px}
      .note{fill:#57606a;font-size:13px}
      line{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .cap{fill:#57606a;font-size:13px;font-weight:bold;letter-spacing:.04em}
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="500" rx="10" fill="#ffffff"/>

  <text class="cap" x="20" y="24">SOURCES · 3 FRAMES</text>
  <text class="cap" x="230" y="24">ONE GRID</text>
  <text class="cap" x="430" y="24">PRODUCTS AT ±60°</text>
  <text class="cap" x="650" y="24">LABELS, METHOD</text>
  <text class="cap" x="870" y="24">RESULT</text>

  <!-- sources -->
  <rect class="b src" x="20" y="40" width="180" height="78" rx="6"/>
  <text x="32" y="65" class="t">Viking MDIM 2.1</text>
  <text x="32" y="85" class="s">colour, 232 m</text><text x="32" y="104" class="s">meridian 0°</text>
  <rect class="b src" x="20" y="132" width="180" height="78" rx="6"/>
  <text x="32" y="157" class="t">THEMIS day IR</text>
  <text x="32" y="177" class="s">100 m</text><text x="32" y="196" class="s">meridian 180°</text>
  <rect class="b src" x="20" y="224" width="180" height="78" rx="6"/>
  <text x="32" y="249" class="t">THEMIS night IR</text>
  <text x="32" y="269" class="s">100 m</text><text x="32" y="288" class="s">±60° only</text>
  <rect class="b src" x="20" y="316" width="180" height="78" rx="6"/>
  <text x="32" y="341" class="t">HRSC/MOLA DEM</text>
  <text x="32" y="361" class="s">200 m</text><text x="32" y="380" class="s">geographic degrees</text>

  <!-- grid -->
  <rect class="b mid" x="230" y="168" width="170" height="97" rx="6"/>
  <text x="242" y="193" class="t">grid60.py</text>
  <text x="242" y="213" class="s">read from the</text>
  <text x="242" y="232" class="s">night mosaic,</text>
  <text x="242" y="251" class="s">100 m and 200 m</text>
  <line x1="200" y1="79" x2="228" y2="190"/>
  <line x1="200" y1="171" x2="228" y2="207"/>
  <line x1="200" y1="263" x2="228" y2="226"/>
  <line x1="200" y1="355" x2="228" y2="243"/>

  <!-- products -->
  <rect class="b mid" x="430" y="40" width="190" height="78" rx="6"/>
  <text x="442" y="65" class="t">Terrain</text>
  <text x="442" y="85" class="s">slope, aspect,</text><text x="442" y="104" class="s">hillshade, relief</text>
  <rect class="b mid" x="430" y="132" width="190" height="78" rx="6"/>
  <text x="442" y="157" class="t">7-band stack</text>
  <text x="442" y="177" class="s">RGB, night, day,</text><text x="442" y="196" class="s">slope, relief; 200 m</text>
  <rect class="b mid" x="430" y="224" width="190" height="78" rx="6"/>
  <text x="442" y="249" class="t">Contrast index</text>
  <text x="442" y="269" class="s">day against night,</text><text x="442" y="288" class="s">relative only</text>
  <rect class="b mid" x="430" y="360" width="190" height="78" rx="6"/>
  <text x="442" y="385" class="t">Machine candidates</text>
  <text x="442" y="405" class="s">channels, craters,</text><text x="442" y="424" class="s">basins</text>
  <line x1="400" y1="185" x2="428" y2="84"/>
  <line x1="400" y1="205" x2="428" y2="171"/>
  <line x1="400" y1="232" x2="428" y2="260"/>
  <line x1="400" y1="252" x2="428" y2="392"/>
  <line x1="525" y1="118" x2="525" y2="130"/>

  <!-- labels and method -->
  <rect class="b mid" x="650" y="132" width="190" height="78" rx="6"/>
  <text x="662" y="157" class="t">SVM and U-Net</text>
  <text x="662" y="177" class="s">whole 15° blocks,</text><text x="662" y="196" class="s">14 of 39 held out</text>
  <rect class="b hand" x="650" y="226" width="190" height="122" rx="6"/>
  <text x="662" y="251" class="t">Hand-drawn labels</text>
  <text x="662" y="271" class="n">round 2: 971 labels,</text>
  <text x="662" y="290" class="n">7 classes, proposed</text>
  <text x="662" y="309" class="n">and reviewed</text>
  <text x="662" y="334" class="s">round 1: 512, 4 classes</text>
  <line x1="620" y1="171" x2="648" y2="171"/>
  <line x1="745" y1="226" x2="745" y2="212"/>

  <!-- results -->
  <rect class="b out" x="870" y="56" width="210" height="78" rx="6"/>
  <text x="882" y="81" class="t">SVM landform map</text>
  <text x="882" y="101" class="n">7 classes: 42.5%, κ 0.31</text>
  <text x="882" y="120" class="s">4 classes: 73.8%, κ 0.58</text>
  <rect class="b out" x="870" y="208" width="210" height="78" rx="6"/>
  <text x="882" y="233" class="t">U-Net province map</text>
  <text x="882" y="253" class="n">7 classes: 69.0%, κ 0.61</text>
  <text x="882" y="272" class="s">4 classes: 98.9%, κ 0.98</text>
  <rect class="b open" x="870" y="370" width="210" height="58" rx="6"/>
  <text x="882" y="395" class="t">Hand digitising</text>
  <text x="882" y="415" class="s">open: the critical path</text>
  <line x1="840" y1="155" x2="868" y2="100"/>
  <line x1="840" y1="190" x2="868" y2="240"/>
  <line x1="620" y1="399" x2="868" y2="399"/>

  <text x="20" y="470" class="note">Scores: area-weighted accuracy and κ on held-out polygons, 237 for seven classes and 183 for four, so the two lines in a box</text>
  <text x="20" y="488" class="note">are not directly comparable; the seven-class maps are the current ones. Elevation stays out of the stack: in raw metres it would swamp the 8-bit bands.</text>
</svg>
